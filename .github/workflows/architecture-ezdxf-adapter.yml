name: Architecture ezdxf optional adapter contract

on:
  push:
    branches:
      - feature/architecture-b1-ezdxf-adapter
      - feature/architecture-w2-dxf-edit-transaction
  pull_request:
    paths:
      - 'src/geometry_harness/domains/architecture/**'
      - 'tests/test_architecture_ezdxf_adapter.py'
      - 'tests/test_architecture_dxf_transaction.py'
      - '.github/workflows/architecture-ezdxf-adapter.yml'

permissions:
  contents: read

jobs:
  pinned-ezdxf:
    name: Pin and test MIT ezdxf wall-only reader
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact reviewed optional DXF library
        run: |
          python -m pip install --disable-pip-version-check 'ezdxf==1.4.5'
          python - <<'PY'
          from importlib.metadata import version
          assert version("ezdxf") == "1.4.5"
          print("Pinned ezdxf version verified")
          PY
      - name: Real DXF import and negative gates — zero model calls
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_architecture_ezdxf_adapter.py' -v
          python -m unittest discover -s tests -p 'test_architecture_plan_schema.py' -v
          python -m unittest discover -s tests -p 'test_architecture_geometry_math.py' -v
          python -m unittest discover -s tests -p 'test_architecture_dxf_transaction.py' -v
          python -m unittest discover -s tests -p 'test_architecture_host_approved_transaction.py' -v
      - name: Independent synthetic annotated DXF W2 acceptance (zero inference)
        env:
          PYTHONPATH: src
        run: |
          python -m geometry_harness.domains.architecture.e2e_move_door --out "$RUNNER_TEMP/arch-mvp-dxf-$GITHUB_RUN_ID"
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ["RUNNER_TEMP"])/("arch-mvp-dxf-"+os.environ["GITHUB_RUN_ID"])
          data=json.loads((out/"e2e-manifest.json").read_text())
          assert data["status"]=="PASS_EXACT_SYNTHETIC_DXF_MOVE_AND_ROLLBACK"
          assert data["move_mm"]==300 and data["new_model_calls"]==0
          assert len(data["artifacts"])>=8
          assert (out/"transaction"/"candidate.dxf").is_file()
          print("Real ezdxf synthetic E2E gate passed; no Blender or models")
          PY
      - name: E4 synthetic host-approved proposal to verified DXF
        env:
          PYTHONPATH: src
          GEOMETRY_ALLOW_REMOTE_INFERENCE: "0"
        run: |
          python -m geometry_harness.domains.architecture.e2e_host_approved --out "$RUNNER_TEMP/arch-mvp-e4-$GITHUB_RUN_ID"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/("arch-mvp-e4-"+os.environ["GITHUB_RUN_ID"])
          data=json.loads((root/"e4-evidence.json").read_text())
          assert data["status"]=="PASS_E4_SYNTHETIC_HOST_FIXTURE_DXF_REOPEN"
          assert data["model_calls_this_run"]==0 and not data["human_approved"]
          assert data["model_response_origin"]=="SYNTHETIC_JSON_FIXTURE_NOT_LIVE_QWEN"
          assert data["source_unchanged"] and data["non_targets_unchanged"]
          assert data["independent_dxf_reopen"] and data["rollback_present"]
          PY
