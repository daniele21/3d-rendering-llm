name: Validate engineering template

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  template-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify template repository baseline
        run: python3 template/scripts/verify_repository.py --root template --template-mode
      - name: Verify template operating contract
        run: python3 template/scripts/verify_operations.py --root template --template-mode
      - name: Verify template validation cadence
        run: python3 template/scripts/verify_validation_cadence.py --root template --template-mode
      - name: Verify template E2E environment contract
        run: python3 template/scripts/verify_e2e.py --root template --template-mode
      - name: Verify integration/release environment policy
        run: python3 template/scripts/verify_stage_environment_policy.py --root template --template-mode
      - name: Verify template infrastructure contract
        run: python3 template/scripts/verify_infrastructure.py --root template --template-mode
      - name: Verify template product development contract
        run: python3 template/scripts/verify_product_development.py --root template --template-mode
      - name: Verify template product experience contract
        run: python3 template/scripts/verify_product_experience.py --root template --template-mode
      - name: Verify template documentation budgets
        run: python3 template/scripts/verify_docs.py --root template --template-mode
      - name: Verify template agent context
        run: python3 template/scripts/verify_agent_context.py --root template --template-mode
      - name: Test context route accounting
        run: python3 -m unittest discover -s tests -v
      - name: Compile validation scripts
        run: python3 -m py_compile template/scripts/*.py
