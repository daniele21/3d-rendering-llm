name: Geometry - pinned 3DCodeBench prompt freeze (NO LLM)

on:
  push:
    branches:
      - feature/bh03-luna-pricing-hf-freeze
    paths:
      - 'benchmarks/catalog/**'
      - '.github/workflows/geometry-upstream-dataset-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-prompts:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official public dataset client only
        run: python -m pip install "huggingface_hub>=0.30,<2"
      - name: Download exact 3DCode dataset revision and isolate six public prompts
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/catalog/freeze_real.py --output /tmp/geometry-benchmark-freeze
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/geometry-benchmark-freeze")
          report=json.loads((root/"freeze-report.json").read_text())
          assert report["categories_verified"]==212 and report["model_calls"]==0
          assert report["hidden_reference_scripts_exported"]==0
          for p in (root/"generator-public-smoke").rglob("*"):
              assert p.is_dir() or p.name in {"prompt_description.txt","prompt_instruction.txt","staging-manifest.json"}
          print("3DCodeBench 212 categories, six public prompts only, no references exposed")
          print(json.dumps(report, indent=2))
          PY
      - name: Upload small no-reference metadata only (no factories/meshes)
        uses: actions/upload-artifact@v4
        with:
          name: pinned-3dcodebench-public-metadata
          retention-days: 14
          if-no-files-found: error
          path: |
            /tmp/geometry-benchmark-freeze/freeze-report.json
            /tmp/geometry-benchmark-freeze/suite.json
            /tmp/geometry-benchmark-freeze/generator-public-smoke/staging-manifest.json
